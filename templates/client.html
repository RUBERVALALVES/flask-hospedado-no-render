<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Meta viewport obrigatória para mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css"
  <meta charset="UTF-8">
  <title>Previsão Doenças em Aves</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #f7f7f7;
      font-family: Arial, sans-serif;
      color: #222;
      margin: 0;
      padding: 0;
    }

/* Container que alinha as imagens lado a lado */
.image-container {
  display: flex;
  justify-content: center; /* Centraliza as imagens */
  align-items: center;     /* Alinha verticalmente pelo centro */
  gap: 15px;               /* Espaçamento entre as duas imagens */
  flex-wrap: wrap;         /* Permite que as imagens dobrem de linha no celular */
  margin: 15px 0;
}

/* Regra responsiva para cada imagem */
.responsive-img {
  width: 100%;
  max-width: 150px;        /* Ajuste este tamanho conforme preferir */
  height: auto;            /* Mantém a proporção */
  border-radius: 8px;      /* Opcional: cantos arredondados */
}

/* Ajuste específico para telas de celular pequenas */
@media (max-width: 480px) {
  .responsive-img {
    max-width: 45%;        /* Permite que fiquem lado a lado mesmo em telas menores */
  }
}

    
    .container {
      width: 100;
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    
.header-image {
  display: block;
  margin: 15px auto;   /* Centraliza a imagem e dá margem acima/abaixo */
  width: 100%;          /* Ocupa a largura total do contêiner em telas pequenas */
  max-width: 250px;     /* Define um limite máximo para não ficar gigante no PC */
  height: auto;         /* Mantém as proporções da imagem sem distorcer */
  border-radius: 8px;   /* Opcional: cantos levemente arredondados */
}
    
    h2 {
      text-align: center;
      margin-bottom: 10px;
      color: #007bff;
    }

    h4 {
      text-align: center;
      color: #555;
      margin-top: 0;
    }

    form {
      text-align: center;
      margin-top: 20px;
    }

    .file-box {
     display: block;
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: #fff;
      overflow: hidden; /* E
    }

    input[type="file"] {
    width: 100%;
      max-width: 100%;
    }

   input[type="submit"] {
      width: 100%; /* Facilita o toque no celular */
      margin-top: 15px;
      padding: 12px 16px;
      background-color: #2a9df4;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    .diagnosis-section {
      margin-top: 30px;
      padding: 15px;
      background-color: #f9fbff;
      border-left: 5px solid #007bff; 
      border-radius: 6px;
    }

    .diagnosis-section h3 {
      margin-bottom: 10px;
      font-size: 18px;
    }

    .diagnosis-image {
    display: block;
      margin: 10px auto;
      width: 100%; /* Adapta a imagem ao container */
      max-width: 300px;
      height: auto;
    }

    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 13px;
      color: #999;
    }
@media (max-width: 480px) {
      .container {
        padding: 15px;
        margin: 10px auto;
      }

      h2 {
        font-size: 20px;
      }

      h4 {
        font-size: 14px;
      }
}

    
  </style>
</head>

<body>
  
  <div class="container">
    <h2>Diagnostico da Saúde do Frango</h2>
  
    <h4>Selecione uma imagem de fezes de Frango para Diagnostico</h4>
    <div class="image-container">
  <img src="{{ url_for('static', filename='logoiatsvtec.png') }}" alt="Logo 1" class="responsive-img">
  <img src="{{ url_for('static', filename='frangosoescrito.png') }}" alt="Logo 2" class="responsive-img">
</div>
 <!--    <img src="{{ url_for('static', filename='logoiatsvtec.png') }}" alt="FRANGAO" style="max-width: 30%; height: auto;"> -->
      <form method="post" action="/" enctype="multipart/form-data">
      <div class="file-box">
        <input type="file" name="file" required>
      </div>
      <br>
      <input type="submit" value="Enviar para Análise">
    </form>

    {% if error_message %}
    <div style="margin-top:20px; padding:12px; border-radius:8px; background:#ffeaea; color:#b30000; text-align:center;">
      {{ error_message }}
    </div>
    {% endif %}

    {% if prediction and image %}
    <div class="diagnosis-section">
      <h3>Diagnostico</h3>
      <p>{{ prediction }}</p>
      <img src="{{ image }}" alt="Uploaded Image" class="diagnosis-image">
    </div>
    {% endif %}
  </div>
</body>
</html>
